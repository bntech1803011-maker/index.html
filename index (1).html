<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유상수리 영수증</title>

<!-- ===================== 폰트(Pretendard) ===================== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
/* =========================================================================
   [디자인 토큰] 색상·치수를 한곳에서 관리한다. 유지보수 시 이 값만 수정한다.
   ========================================================================= */
:root{
  --beige:      #eef3f1;   /* 헤더/구분 셀: 차분한 쿨 뉴트럴 */
  --beige-deep: #d6e8e1;   /* 강조 행(합계 등): 브랜드 톤 옅은 청록 */
  --line:       #2d3a36;   /* 표 테두리: 부드러운 다크 슬레이트 */
  --line-soft:  #b9c4c0;   /* 입력 칸 보조선 */
  --brand:      #00b894;   /* REENCLE 브랜드 컬러 */
  --ink:        #1a1a1a;   /* 기본 글자색 */
  --paper-w:    210mm;     /* A4 가로 */
  --paper-pad:  10mm;      /* 용지 내부 여백 */
  --fs-base:    12px;      /* 기본 글자 크기(A4 1페이지 맞춤) */
}

/* =========================================================================
   [기본 리셋]
   ========================================================================= */
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:'Pretendard', -apple-system, sans-serif;
  font-size:var(--fs-base);
  color:var(--ink);
  background:#d9d9d9;            /* 화면에서 용지 밖 배경(회색) */
  line-height:1.35;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* =========================================================================
   [상단 툴바] 화면에서만 보이고 인쇄 시 숨긴다(.no-print)
   ========================================================================= */
.toolbar{
  position:sticky; top:0; z-index:50;
  display:flex; gap:8px; justify-content:flex-end; align-items:center;
  max-width:var(--paper-w); margin:12px auto 0; padding:8px 4px;
}
.toolbar .spacer{ margin-right:auto; font-weight:700; color:#444; padding-left:6px; }
.btn{
  font-family:inherit; font-size:13px; font-weight:600;
  padding:8px 14px; border:1px solid #333; border-radius:6px;
  background:#fff; color:#222; cursor:pointer; transition:.12s;
}
.btn:hover{ background:#f1f1f1; }
.btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn.primary:hover{ filter:brightness(.94); }

/* =========================================================================
   [용지] A4 한 페이지. 화면에서는 흰 종이처럼 보이게 그림자 처리.
   ========================================================================= */
.page{
  position:relative;
  display:flex; flex-direction:column;   /* 콘텐츠를 세로로 쌓고 하단 균형 배치 */
  width:var(--paper-w);
  min-height:297mm;
  margin:12px auto 40px;
  padding:var(--paper-pad);
  background:#fff;
  box-shadow:0 2px 14px rgba(0,0,0,.25);
}

/* [워터마크] 페이지 중앙 반투명 "1 페이지" */
.watermark{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%) rotate(-24deg);
  font-size:90px; font-weight:800; letter-spacing:6px;
  color:rgba(0,0,0,.06);
  pointer-events:none; user-select:none; z-index:0; white-space:nowrap;
}

/* 워터마크 위로 내용이 올라오도록 */
.page > *:not(.watermark){ position:relative; z-index:1; }

/* =========================================================================
   [문서 헤더] 베이지 바탕 + 브랜드 + 제목
   ========================================================================= */
.doc-head{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--beige);
  border:1.5px solid var(--line);
  padding:10px 16px; margin-bottom:8px;
}
.doc-head .brand{ font-size:18px; font-weight:800; color:var(--brand); letter-spacing:.5px; }
.doc-head .brand small{ display:block; font-size:11px; font-weight:600; color:#6b6b6b; letter-spacing:0; }
.doc-head .title{ font-size:24px; font-weight:800; letter-spacing:8px; }

/* =========================================================================
   [공통 표 스타일] 검은 테두리 표
   ========================================================================= */
table{ width:100%; border-collapse:collapse; }
th,td{ border:1px solid var(--line); padding:4px 6px; vertical-align:middle; }
th{ background:var(--beige); font-weight:700; text-align:center; white-space:nowrap; }

/* 표 안에서 쓰는 입력 칸: 테두리 없이 칸을 꽉 채운다(인쇄 깔끔) */
.cell-input{
  width:100%; border:none; outline:none; background:transparent;
  font-family:inherit; font-size:inherit; color:var(--ink); padding:2px 2px;
}
.cell-input:focus{ background:#fffae6; }       /* 입력 중 강조(화면용) */
.cell-input.num{ text-align:right; }            /* 금액 등 우측정렬 */

/* 섹션 제목 띠 */
.section-bar{
  background:var(--beige-deep); border:1px solid var(--line); border-bottom:none;
  font-weight:800; text-align:center; padding:5px; letter-spacing:2px;
}

/* =========================================================================
   [고객정보 표]
   ========================================================================= */
.customer th{ width:90px; }
.customer td{ }

/* 접수내용 한 줄 + 수리내역 영역 간격 */
.intake{ margin-top:8px; }
.intake th{ width:90px; }
.repair-wrap{ margin-top:8px; }

/* =========================================================================
   [본문 2단 레이아웃] 좌:의뢰내용 / 우:수리내역
   ========================================================================= */
.body-grid{ display:flex; gap:0; margin-top:8px; }
.col-left{ flex:0 0 42%; }
.col-right{ flex:1 1 58%; border-left:none; }

/* 의뢰내용 표: 행 높이를 영수증과 유사하게 일정 높이로 고정 */
.request-table td{ height:26px; }
.request-table .no{ width:34px; text-align:center; background:#fafafa; }

/* 수리내역 표 */
.repair-table .no{ width:34px; text-align:center; background:#fafafa; }
.repair-table .amt{ width:104px; }
/* 금액 입력칸 + [무상] 버튼을 한 칸에 나란히 배치 */
.amt-wrap{ display:flex; align-items:center; gap:3px; }
.amt-wrap .amount{ flex:1; min-width:0; }
.svc-btn{
  flex:0 0 auto; border:1px solid var(--brand); color:var(--brand); background:#fff;
  border-radius:4px; font-size:10px; line-height:1; padding:3px 4px; cursor:pointer; white-space:nowrap;
}
.svc-btn:hover{ background:#effaf6; }
.svc-btn.active{ background:var(--brand); color:#fff; }
.repair-table .del{ width:30px; text-align:center; }
.repair-table select.cell-input{ cursor:pointer; }
.row-del-btn{
  border:1px solid #c0392b; color:#c0392b; background:#fff;
  border-radius:4px; font-size:11px; line-height:1; padding:3px 5px; cursor:pointer;
}
.row-del-btn:hover{ background:#fdecea; }
.add-row-wrap{ margin-top:4px; }
.add-row-btn{
  width:100%; border:1px dashed var(--brand); color:var(--brand); background:#fff;
  border-radius:6px; padding:6px; font-weight:700; cursor:pointer;
}
.add-row-btn:hover{ background:#effaf6; }

/* =========================================================================
   [비용 계산 표]
   ========================================================================= */
.cost-wrap{ margin-top:8px; }
.cost-table th{ width:140px; text-align:center; }
.cost-table td{ text-align:right; }
.cost-table .final th{ background:var(--beige-deep); font-size:14px; }
.cost-table .final td{ background:var(--beige-deep); font-weight:800; font-size:15px; }
.cost-table .final .cell-input{ font-weight:800; font-size:15px; }
.readonly-amt{ font-weight:700; }

/* =========================================================================
   [하단 영역] 수리완료일자 + 최종 수리비용
   ========================================================================= */
.foot-grid{ display:flex; gap:8px; margin-top:10px; }
.foot-grid table{ }
.foot-box{ flex:1; }
.foot-final th{ background:var(--brand); color:#fff; font-size:14px; }
.foot-final td{ text-align:right; font-size:18px; font-weight:800; }

.sign-row{ margin-top:14px; text-align:right; font-size:12px; color:#555; }

/* [영수 확인 블록] 문구 + 회사명 + 직인 + 작성일자 */
.confirm-block{ margin:0 0 12px; text-align:center; }
.confirm-text{ font-size:13.5px; margin:0 0 14px; color:#222; }
.confirm-company{
  display:inline-block; position:relative;
  font-size:22px; font-weight:800; letter-spacing:3px; padding-right:62px;
}
.confirm-company .seal{
  position:absolute; right:0; top:50%; transform:translateY(-50%);
  width:54px; height:54px; object-fit:contain;
}
.confirm-date{ font-size:12.5px; color:#444; margin:16px 0 0; }
.confirm-date .date-inline{
  width:auto; display:inline-block; text-align:center;
  border-bottom:1px solid #aaa; padding:0 2px;
}

/* =========================================================================
   [인쇄 규칙] 버튼 숨김 / A4 세로 / 색상 유지
   ========================================================================= */
@media print{
  body{ background:#fff; }
  .no-print{ display:none !important; }
  /* 인쇄영역(A4 297mm − 상하 여백 10mm×2 = 277mm)을 꽉 채워 하단 균형 유지 */
  .page{ margin:0; box-shadow:none; width:auto; min-height:277mm; padding:0; }
  @page{ size:A4 portrait; margin:10mm; }
  .cell-input:focus{ background:transparent; }   /* 인쇄 시 강조 제거 */
}
</style>
</head>

<body>

<!-- ===================== 상단 툴바(인쇄 시 숨김) ===================== -->
<div class="toolbar no-print">
  <span class="spacer">유상수리 영수증 자동 작성</span>
  <input type="file" id="loadFile" accept="application/json" style="display:none">
  <button class="btn" onclick="document.getElementById('loadFile').click()">견적서 불러오기</button>
  <button class="btn" onclick="saveJSON()">견적서 저장(JSON)</button>
  <button class="btn primary" onclick="window.print()">PDF 저장</button>
  <button class="btn primary" onclick="window.print()">인쇄</button>
</div>

<!-- ===================== A4 용지 ===================== -->
<div class="page" id="page">

  <!-- 워터마크 -->
  <div class="watermark">1 페이지</div>

  <!-- 문서 헤더 -->
  <div class="doc-head">
    <div class="brand">REENCLE<small>㈜비앤테크</small></div>
    <div class="title">유상수리 영수증</div>
    <div style="width:120px"></div><!-- 좌우 균형용 빈 공간 -->
  </div>

  <!-- 고객정보 표 -->
  <table class="customer">
    <tr>
      <th>모델명</th>
      <td>
        <select class="cell-input" data-key="model">
          <option value="">(선택)</option>
          <option value="RC-02">RC-02</option>
          <option value="RC-Easy100">RC-Easy100</option>
          <option value="RC-GT500">RC-GT500</option>
          <option value="RC-GT500(W)">RC-GT500(W)</option>
          <option value="RC-Prime300">RC-Prime300</option>
          <option value="RC-Prime S320">RC-Prime S320</option>
          <option value="RT220">RT220</option>
        </select>
      </td>
      <th>접수번호</th>
      <td><input class="cell-input" data-key="receiptNo"></td>
    </tr>
    <tr>
      <th>성명</th>
      <td><input class="cell-input" data-key="name"></td>
      <th>연락처</th>
      <td><input class="cell-input" data-key="phone"></td>
    </tr>
    <tr>
      <th>주소</th>
      <td colspan="3"><input class="cell-input" data-key="address"></td>
    </tr>
    <tr>
      <th>접수일자</th>
      <td><input class="cell-input" type="date" data-key="receiptDate"></td>
      <th>작성자명</th>
      <td><input class="cell-input" data-key="writer"></td>
    </tr>
  </table>

  <!-- 접수내용: 가로 한 줄 -->
  <table class="customer intake">
    <tr>
      <th>접수내용</th>
      <td><input class="cell-input" data-key="intake"></td>
    </tr>
  </table>

  <!-- 수리 내역 (전체 폭, 행 추가 가능) -->
  <div class="repair-wrap">
    <div class="section-bar">수리 내역</div>
    <table class="repair-table">
      <thead>
        <tr>
          <th class="no">순번</th>
          <th>부품명</th>
          <th class="amt">금액</th>
          <th class="del no-print"></th>
        </tr>
      </thead>
      <tbody id="repairBody"><!-- JS가 행을 생성/추가 --></tbody>
    </table>
    <div class="add-row-wrap no-print">
      <button class="add-row-btn" onclick="addRepairRow()">＋ 행 추가</button>
    </div>
  </div>

  <!-- 비용 계산 -->
  <div class="cost-wrap">
    <table class="cost-table">
      <tr>
        <th>부품비 합계</th>
        <td><span class="readonly-amt" id="partsTotal">0원</span></td>
      </tr>
      <tr>
        <th>공임비</th>
        <td><input class="cell-input num" type="text" inputmode="numeric" data-key="labor" value="33,000" oninput="onMoneyInput(this); recalc()"> 원</td>
      </tr>
      <tr>
        <th>택배비</th>
        <td><input class="cell-input num" type="text" inputmode="numeric" data-key="delivery" value="12,000" oninput="onMoneyInput(this); recalc()"> 원</td>
      </tr>
      <tr>
        <th>특별할인금액 (−)</th>
        <td><input class="cell-input num" type="text" inputmode="numeric" data-key="depreciation" placeholder="0" oninput="onMoneyInput(this); setDriver('depreciation')"> 원</td>
      </tr>
      <tr class="final">
        <th>최종 수리비</th>
        <td><input class="cell-input num" id="finalCost" data-key="finalCost" type="text" inputmode="numeric" placeholder="0" oninput="onMoneyInput(this); setDriver('final')"> 원</td>
      </tr>
    </table>
  </div>

  <!-- 하단: 수리완료일자 + 최종 수리비용 -->
  <div class="foot-grid">
    <div class="foot-box">
      <table>
        <tr>
          <th style="width:120px">수리완료일자</th>
          <td><input class="cell-input" type="date" data-key="doneDate"></td>
        </tr>
      </table>
    </div>
    <div class="foot-box">
      <table class="foot-final">
        <tr>
          <th style="width:140px">최종 수리비용</th>
          <td><span id="finalCostFoot">0원</span></td>
        </tr>
      </table>
    </div>
  </div>

  <!-- 가변 여백: 위 내용과 영수 확인 블록 사이를 채워 균형 배치(최소 36px 보장) -->
  <div style="flex:1 1 auto; min-height:36px"></div>

  <!-- 영수 확인 블록(문구 + 회사명 + 직인 + 작성일자) -->
  <div class="confirm-block">
    <p class="confirm-text">다음과 같이 제품 수리비용을 영수했음을 확인합니다.</p>
    <div class="confirm-company">

<script>
/* =========================================================================
   [1] 부품 단가 DB
   - 이 객체만 수정하면 단가가 전체에 자동 반영된다.
   - 값이 숫자면 금액, 문자열 "서비스교체"면 무상(합계 제외) 처리한다.
   ========================================================================= */
const PART_DB = {
  // --- 유상부품(숫자 단가) ---
  // ※ 무상 처리는 더 이상 부품에 고정하지 않는다.
  //    각 행 금액 칸의 [무상] 버튼으로 "서비스교체"를 직접 지정한다.
  "모터":              45000,
  "모터기어":          23000,
  "팬모터":            45000,
  "메인PCB":           55000,
  "교반봉":            45000,
  "교반봉 날개":       12000,
  "교반봉아셈":        53000,
  "열림모터":          40000,
  "기어상":            13000,
  "기어하":            12000,
  "체인":              11000,
  "베어링":            11000,
  "탑커버로터리아셈":  16000,
  "기어":              25000,
  "보온재":            11000,
  "힌지1개":           8000,
  "씰링고무":          7000,
  "키PCB":             18000,
  "플랜지아셈":        7000,
  "스냅링":            4200,
  "챔버":              45000,
  "기어커버로어":      12000
};

const SERVICE_LABEL = "서비스교체";   // 무상 처리 식별 문자열

/* =========================================================================
   [2] 유틸 함수
   ========================================================================= */

// 숫자 → "58,500원" 형식
function won(n){ return Number(n||0).toLocaleString('ko-KR') + '원'; }

// 입력 문자열에서 숫자만 추출(콤마/문자 제거). 숫자 없으면 0.
function toNumber(str){
  const digits = String(str==null?'':str).replace(/[^0-9-]/g,'');
  const n = parseInt(digits,10);
  return isNaN(n) ? 0 : n;
}

// 금액 입력칸에 천단위 콤마를 실시간 적용
function onMoneyInput(el){
  const n = toNumber(el.value);
  el.value = n ? n.toLocaleString('ko-KR') : '';
}

/* =========================================================================
   [3] 좌측 "의뢰 내용" 10행 자동 생성
   ========================================================================= */
function buildRequestRows(){
  const tb = document.getElementById('requestBody');
  tb.innerHTML = '';
  for(let i=1; i<=10; i++){
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td class="no">${i}</td>` +
      `<td><input class="cell-input" data-req="${i}"></td>`;
    tb.appendChild(tr);
  }
}

/* =========================================================================
   [4] 우측 "수리 내역" 행 생성/추가/삭제
   ========================================================================= */

// 부품명 <select> 옵션 HTML 생성(DB 기반 + 직접입력)
function partOptions(){
  let html = `<option value="">(선택)</option>`;
  for(const name in PART_DB){ html += `<option value="${name}">${name}</option>`; }
  html += `<option value="__custom__">직접입력</option>`;
  return html;
}

// 행 1개를 추가한다
function addRepairRow(){
  const tb = document.getElementById('repairBody');
  const tr = document.createElement('tr');
  tr.innerHTML =
    `<td class="no"></td>` +
    `<td>
        <select class="cell-input part-select" onchange="onPartSelect(this)">${partOptions()}</select>
        <input class="cell-input part-custom" style="display:none" placeholder="부품명 입력">
     </td>` +
    `<td class="amt">
        <div class="amt-wrap">
          <input class="cell-input num amount" type="text" inputmode="numeric"
            oninput="onMoneyInput(this); recalc()" placeholder="0">
          <button class="svc-btn no-print" onclick="toggleService(this)" title="서비스교체(무상) 처리">무상</button>
        </div>
     </td>` +
    `<td class="del no-print"><button class="row-del-btn" onclick="deleteRepairRow(this)">삭제</button></td>`;
  tb.appendChild(tr);
  renumberRepairRows();
  recalc();
}

// 부품 선택 시: 금액 자동 입력 / 서비스교체 / 직접입력 분기
function onPartSelect(sel){
  const tr     = sel.closest('tr');
  const custom = tr.querySelector('.part-custom');
  const amt    = tr.querySelector('.amount');
  const val    = sel.value;

  if(val === '__custom__'){            // 직접입력 모드
    custom.style.display = '';
    custom.focus();
    amt.value = '';
    amt.readOnly = false;
    recalc();
    return;
  }

  custom.style.display = 'none';       // 일반 모드
  custom.value = '';

  if(val === ''){ amt.value=''; amt.readOnly=false; recalc(); return; }

  const price = PART_DB[val];
  if(price === SERVICE_LABEL){         // 무상 교체(현재 DB엔 없으나 호환 위해 유지)
    amt.value = SERVICE_LABEL;
    amt.readOnly = true;               // 금액 수정 잠금
  }else{                               // 유상 부품
    amt.value = Number(price).toLocaleString('ko-KR');
    amt.readOnly = false;              // 필요 시 수정 허용
  }
  syncServiceBtn(tr);                   // [무상] 버튼 상태 동기화
  recalc();
}

// 금액 칸 [무상] 버튼: "서비스교체"(무상, 합계 제외) ↔ 일반 금액 토글
function toggleService(btn){
  const tr  = btn.closest('tr');
  const amt = tr.querySelector('.amount');
  if(amt.value.trim() === SERVICE_LABEL){   // 이미 무상 → 해제
    amt.value = '';
    amt.readOnly = false;
  }else{                                     // 무상으로 설정
    amt.value = SERVICE_LABEL;
    amt.readOnly = true;                     // 숫자 입력 잠금(텍스트 보존)
  }
  syncServiceBtn(tr);
  recalc();
}

// 금액 값에 맞춰 [무상] 버튼 활성 표시를 맞춘다
function syncServiceBtn(tr){
  const btn = tr.querySelector('.svc-btn');
  const amt = tr.querySelector('.amount');
  if(!btn) return;
  btn.classList.toggle('active', amt.value.trim() === SERVICE_LABEL);
}

// 행 삭제
function deleteRepairRow(btn){
  btn.closest('tr').remove();
  renumberRepairRows();
  recalc();
}

// 순번 다시 매기기
function renumberRepairRows(){
  document.querySelectorAll('#repairBody tr').forEach((tr,idx)=>{
    tr.querySelector('.no').textContent = idx+1;
  });
}

/* =========================================================================
   [5] 실시간 비용 계산 (양방향)
   base = 부품비합계 + 공임비 + 택배비
   - 기준이 '특별할인'일 때: 최종수리비 = base − 특별할인금액
   - 기준이 '최종수리비'일 때: 특별할인금액 = base − 최종수리비
   마지막에 입력한 칸이 기준(costDriver)이 된다.
   ========================================================================= */
let costDriver = 'depreciation';   // 'depreciation' | 'final'

// 입력 칸에 따라 기준을 바꾸고 재계산
function setDriver(d){ costDriver = d; recalc(); }

function recalc(){
  // (1) 부품비 합계 (서비스교체=무상 제외)
  let parts = 0;
  document.querySelectorAll('#repairBody .amount').forEach(inp=>{
    if(inp.value.trim() === SERVICE_LABEL) return;
    parts += toNumber(inp.value);
  });

  // (2) 공임비 / 택배비
  const labor    = toNumber(document.querySelector('[data-key="labor"]').value);
  const delivery = toNumber(document.querySelector('[data-key="delivery"]').value);
  const base     = parts + labor + delivery;

  const depEl   = document.querySelector('[data-key="depreciation"]');
  const finalEl = document.getElementById('finalCost');

  let total;   // 최종수리비
  if(costDriver === 'final'){
    // 최종수리비 입력 → 특별할인금액을 역산(차액)
    total = toNumber(finalEl.value);
    const dep = base - total;
    // 기준 칸(finalEl)은 사용자가 입력 중이므로 건드리지 않는다
    depEl.value = dep ? dep.toLocaleString('ko-KR') : '';
  }else{
    // 특별할인금액 입력 → 최종수리비 계산
    const dep = toNumber(depEl.value);
    total = base - dep;
    finalEl.value = total ? total.toLocaleString('ko-KR') : '';
  }

  // (3) 화면 반영
  document.getElementById('partsTotal').textContent    = won(parts);
  document.getElementById('finalCostFoot').textContent = won(total);
}

/* =========================================================================
   [6] 견적서 저장(JSON 다운로드) / 불러오기
   파일명 규칙: 날짜_프로젝트_문서종류_버전  →  20260623_유상수리영수증_견적_v1.json
   ========================================================================= */
function collectState(){
  const state = { meta:{}, request:[], repair:[], cost:{} };

  // 고객정보 + 날짜 등 data-key 입력값 전체
  document.querySelectorAll('[data-key]').forEach(el=>{ state.meta[el.dataset.key] = el.value; });
  state.meta.__driver = costDriver;   // 계산 기준(특별할인/최종수리비)

  // 의뢰내용 10행
  document.querySelectorAll('[data-req]').forEach(el=>{
    state.request.push({ no:Number(el.dataset.req), text:el.value });
  });

  // 수리내역
  document.querySelectorAll('#repairBody tr').forEach(tr=>{
    const sel = tr.querySelector('.part-select');
    const custom = tr.querySelector('.part-custom');
    state.repair.push({
      part:   sel.value,
      custom: custom.value,
      amount: tr.querySelector('.amount').value
    });
  });

  return state;
}

function saveJSON(){
  const state = collectState();
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);

  // 파일명 날짜 = 접수일자 입력값(없으면 오늘)
  const d = (state.meta.receiptDate || new Date().toISOString().slice(0,10)).replace(/-/g,'');
  const a = document.createElement('a');
  a.href = url;
  a.download = `${d}_유상수리영수증_견적_v1.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function loadJSON(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const state = JSON.parse(e.target.result);

      // 고객정보 복원
      for(const k in (state.meta||{})){
        const el = document.querySelector(`[data-key="${k}"]`);
        if(el) el.value = state.meta[k];
      }
      // 계산 기준 복원(이후 recalc가 올바른 방향으로 동작)
      costDriver = (state.meta && state.meta.__driver) || 'depreciation';
      // 의뢰내용 복원
      (state.request||[]).forEach(r=>{
        const el = document.querySelector(`[data-req="${r.no}"]`);
        if(el) el.value = r.text;
      });
      // 수리내역 복원
      document.getElementById('repairBody').innerHTML = '';
      (state.repair||[]).forEach(r=>{
        addRepairRow();
        const tr = document.querySelector('#repairBody tr:last-child');
        const sel = tr.querySelector('.part-select');
        sel.value = r.part || '';
        onPartSelect(sel);                       // 선택 로직 재실행
        if(r.part === '__custom__'){ tr.querySelector('.part-custom').value = r.custom||''; }
        const amt = tr.querySelector('.amount');
        amt.value = r.amount || '';
        amt.readOnly = (amt.value.trim() === SERVICE_LABEL);   // 무상 행 잠금 복원
        syncServiceBtn(tr);                                    // [무상] 버튼 상태 복원
      });
      recalc();
      alert('견적서를 불러왔다.');
    }catch(err){
      alert('불러오기 실패: 올바른 견적서 파일이 아니다.');
    }
  };
  reader.readAsText(file,'utf-8');
}

/* =========================================================================
   [7] 초기화
   ========================================================================= */
window.addEventListener('DOMContentLoaded', ()=>{
  addRepairRow(); addRepairRow(); addRepairRow();  // 수리내역 기본 3행

  // 접수일자 기본값 = 오늘
  document.querySelector('[data-key="receiptDate"]').value = new Date().toISOString().slice(0,10);
  // 작성일자(영수 확인) 기본값 = 오늘
  document.querySelector('[data-key="issueDate"]').value = new Date().toISOString().slice(0,10);

  // 파일 불러오기 이벤트
  document.getElementById('loadFile').addEventListener('change', e=>{
    if(e.target.files[0]) loadJSON(e.target.files[0]);
    e.target.value = '';              // 같은 파일 재선택 허용
  });

  recalc();
});
</script>
